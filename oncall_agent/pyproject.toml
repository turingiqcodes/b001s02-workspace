[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oncall-agent"
version = "1.0.0"
description = "AI-assisted oncall agent for Apache Airflow 3.x"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.27",
    "groq>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
claude = ["anthropic>=2.0"]  # optional provider: ONCALL_LLM_PROVIDER=claude
dev = ["pytest>=8", "anthropic>=2.0"]

[project.scripts]
oncall-agent = "oncall_agent.cli:main"
oncall-airflow-mcp = "oncall_agent.mcp_servers.airflow_server:main"
oncall-linear-mcp = "oncall_agent.mcp_servers.linear_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real Airflow 3.x (set ONCALL_IT_AIRFLOW_URL)"]

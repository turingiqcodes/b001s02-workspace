[project]
name = "github-mcp-server"
version = "0.1.0"
description = "MCP server exposing GitHub repository, pull request, CI/CD, issue and search tools over stdio and Streamable HTTP"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "anyio>=4"]

[project.scripts]
github-mcp-server = "github_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

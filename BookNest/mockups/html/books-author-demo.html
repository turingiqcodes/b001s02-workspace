<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BookNest Author Demo</title>
<style>
  :root { --bg: #e9e3da; --bar: #2f241d; --bar-ink: #f6efe4; --muted: #c9b8a6; --accent: #d4843f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
  header {
    position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
    padding: 10px 16px; background: var(--bar); color: var(--bar-ink); font-size: 14px;
  }
  header strong { font-size: 15px; }
  header .role { color: var(--muted); }
  header .spacer { flex: 1; }
  select, button { font: inherit; border-radius: 6px; border: 1px solid #5b4a3e; background: #3f3128; color: var(--bar-ink); padding: 5px 10px; }
  button { cursor: pointer; }
  button:disabled { opacity: 0.4; cursor: default; }
  label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }
  label input { accent-color: var(--accent); }
  main { max-width: 1440px; margin: 16px auto; padding: 0 16px; }
  .screen svg { display: block; width: 100%; height: auto; border-radius: 8px; box-shadow: 0 2px 10px rgb(0 0 0 / 0.15); background: #f6efe4; }
  .screen a { cursor: pointer; }
  .show-links .screen a { outline: none; }
  .hotspot { fill: rgb(212 132 63 / 0.16); stroke: #d4843f; stroke-width: 2; stroke-dasharray: 6 4; pointer-events: none; }
  .hint { max-width: 1440px; margin: 0 auto 24px; padding: 0 16px; color: #6b5f57; font-size: 13px; }
</style>
</head>
<body>
<header>
  <strong>BookNest</strong><span class="role">Author view · static demo, no database</span>
  <span class="spacer"></span>
  <label for="hotspots"><input type="checkbox" id="hotspots" checked> Show clickable areas</label>
  <button id="prev" type="button" aria-label="Previous screen">←</button>
  <select id="jump" aria-label="Go to screen">
      <option value="login">Author login</option>
      <option value="books">My Books</option>
      <option value="account">My Account</option>
  </select>
  <button id="next" type="button" aria-label="Next screen">→</button>
</header>
<main>
<section class="screen" id="login" data-label="Author login" hidden>

</svg>

<p class="hint">Click the highlighted areas to move between screens, or use the menu and the ← → keys. Buttons that aren't highlighted are design only.</p>
<script>
  const screens = [...document.querySelectorAll('.screen')];
  const ids = screens.map((s) => s.id);
  const jump = document.getElementById('jump');
  const hotspots = document.getElementById('hotspots');

  function drawHotspots(section) {
    document.querySelectorAll('.hotspot').forEach((h) => h.remove());
    if (!hotspots.checked) return;
    const svg = section.querySelector('svg');
    section.querySelectorAll('a').forEach((a) => {
      const b = a.getBBox();
      const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      r.setAttribute('class', 'hotspot');
      r.setAttribute('x', b.x - 4); r.setAttribute('y', b.y - 4);
      r.setAttribute('width', b.width + 8); r.setAttribute('height', b.height + 8);
      r.setAttribute('rx', 6);
      svg.appendChild(r);
    });
  }

  function show() {
    const id = ids.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'login';
    screens.forEach((s) => (s.hidden = s.id !== id));
    const section = document.getElementById(id);
    document.title = 'BookNest Author Demo · ' + section.dataset.label;
    jump.value = id;
    document.getElementById('prev').disabled = id === ids[0];
    document.getElementById('next').disabled = id === ids[ids.length - 1];
    drawHotspots(section);
    window.scrollTo(0, 0);
  }

  function go(step) {
    const i = ids.indexOf(jump.value) + step;
    if (i >= 0 && i < ids.length) location.hash = ids[i];
  }

  window.addEventListener('hashchange', show);
  jump.addEventListener('change', () => (location.hash = jump.value));
  document.getElementById('prev').addEventListener('click', () => go(-1));
  document.getElementById('next').addEventListener('click', () => go(1));
  hotspots.addEventListener('change', show);
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('select')) return;
    if (e.key === 'ArrowRight') go(1);
    if (e.key === 'ArrowLeft') go(-1);
  });
  show();
</script>

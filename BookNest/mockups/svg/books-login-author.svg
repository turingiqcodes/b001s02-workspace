<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>BookNest – Author Login</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6efe4"/>
      <stop offset="1" stop-color="#ead9c0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b3a29"/>
      <stop offset="1" stop-color="#3b2418"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b5652b"/>
      <stop offset="1" stop-color="#d4843f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#3b2418" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Page background -->
  <rect width="1200" height="760" fill="url(#bg)"/>
  <circle cx="1120" cy="80" r="140" fill="#e2c9a6" opacity="0.5"/>
  <circle cx="80" cy="700" r="110" fill="#e2c9a6" opacity="0.5"/>

  <!-- Card -->
  <g filter="url(#shadow)">
    <rect x="120" y="90" width="960" height="580" rx="24" fill="#ffffff"/>
  </g>

  <!-- Left illustration panel -->
  <clipPath id="leftClip">
    <rect x="120" y="90" width="440" height="580" rx="24"/>
  </clipPath>
  <g clip-path="url(#leftClip)">
    <rect x="120" y="90" width="460" height="580" fill="url(#panel)"/>

    <!-- Bookshelf -->
    <g transform="translate(180,300)">
      <rect x="0" y="150" width="320" height="14" rx="3" fill="#a87447"/>
      <rect x="10"  y="40"  width="34" height="110" rx="3" fill="#d4843f"/>
      <rect x="10"  y="60"  width="34" height="6" fill="#f6efe4" opacity="0.7"/>
      <rect x="48"  y="20"  width="28" height="130" rx="3" fill="#7fa58b"/>
      <rect x="48"  y="40"  width="28" height="5" fill="#f6efe4" opacity="0.7"/>
      <rect x="80"  y="55"  width="40" height="95" rx="3" fill="#e9c46a"/>
      <rect x="80"  y="75"  width="40" height="6" fill="#5b3a29" opacity="0.4"/>
      <rect x="124" y="30"  width="26" height="120" rx="3" fill="#c0504d"/>
      <rect x="154" y="45"  width="32" height="105" rx="3" fill="#4f7ca8"/>
      <rect x="154" y="65"  width="32" height="5" fill="#f6efe4" opacity="0.7"/>
      <g transform="rotate(14 205 150)">
        <rect x="192" y="40" width="30" height="110" rx="3" fill="#f2e3c9"/>
      </g>
      <rect x="240" y="60"  width="36" height="90" rx="3" fill="#9b6fb0"/>
      <rect x="280" y="35"  width="30" height="115" rx="3" fill="#d4843f"/>
      <rect x="280" y="55"  width="30" height="5" fill="#f6efe4" opacity="0.7"/>
    </g>

    <!-- Open book logo -->
    <g transform="translate(340,190)" fill="none" stroke="#f6efe4" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M0 10 C-20 -2 -48 -2 -64 6 L-64 56 C-48 48 -20 48 0 60 Z"/>
      <path d="M0 10 C20 -2 48 -2 64 6 L64 56 C48 48 20 48 0 60 Z"/>
      <line x1="0" y1="10" x2="0" y2="60"/>
    </g>

    <text x="340" y="290" fill="#f6efe4" font-size="30" font-weight="700" text-anchor="middle">BookNest</text>
    <text x="340" y="520" fill="#f6efe4" font-size="18" text-anchor="middle" opacity="0.9">“A reader lives a thousand lives</text>
    <text x="340" y="546" fill="#f6efe4" font-size="18" text-anchor="middle" opacity="0.9">before he dies.”</text>
    <text x="340" y="578" fill="#e2c9a6" font-size="14" text-anchor="middle">— George R.R. Martin</text>
  </g>

  <!-- Right form -->
  <g transform="translate(640,170)">
    <!-- Which login this is -->
    <rect x="0" y="-46" width="138" height="24" rx="12" fill="#4a6b4f"/>
    <text x="69" y="-29" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">AUTHOR SIGN IN</text>
    <text x="0" y="20" fill="#3b2418" font-size="32" font-weight="700">Welcome back</text>
    <text x="0" y="52" fill="#8a7466" font-size="16">Sign in to see your books</text>

    <!-- Username -->
    <text x="0" y="104" fill="#5b3a29" font-size="14" font-weight="600">Username</text>
    <rect x="0" y="116" width="380" height="50" rx="10" fill="#faf6f0" stroke="#e0d2c0" stroke-width="1.5"/>
    <g transform="translate(16,133)" fill="none" stroke="#a88d78" stroke-width="2">
      <circle cx="11" cy="4" r="5"/>
      <path d="M1 18 a10 8 0 0 1 20 0"/>
    </g>
    <text x="52" y="147" fill="#b3a194" font-size="15">Username from your admin</text>

    <!-- Password -->
    <text x="0" y="200" fill="#5b3a29" font-size="14" font-weight="600">Password</text>
    <rect x="0" y="212" width="380" height="50" rx="10" fill="#ffffff" stroke="#b5652b" stroke-width="2"/>
    <g transform="translate(18,226)" fill="none" stroke="#a88d78" stroke-width="2">
      <rect x="0" y="9" width="18" height="14" rx="3"/>
      <path d="M4 9 V5 a5 5 0 0 1 10 0 V9"/>
    </g>
    <text x="52" y="244" fill="#3b2418" font-size="20" letter-spacing="3">••••••••</text>
    <g transform="translate(342,229)" fill="none" stroke="#a88d78" stroke-width="2">
      <path d="M0 8 C5 0 17 0 22 8 C17 16 5 16 0 8 Z"/>
      <circle cx="11" cy="8" r="3"/>
    </g>

    <!-- Remember / forgot -->
    <rect x="0" y="284" width="18" height="18" rx="4" fill="#b5652b"/>
    <path d="M4 293 L8 297 L14 289" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="298" fill="#5b3a29" font-size="14">Remember me</text>
    <text x="380" y="298" fill="#8a7466" font-size="13" text-anchor="end">Forgot it? Ask your admin</text>

    <!-- Sign in button -->
    <a href="books-author-books.svg">
      <rect x="0" y="326" width="380" height="52" rx="10" fill="url(#btn)"/>
      <text x="190" y="358" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">Sign in</text>
    </a>

    <!-- Who this login is for -->
    <text x="190" y="416" fill="#8a7466" font-size="14" text-anchor="middle">Use the login details your admin gave you.</text>
    <a href="books-login-admin.svg"><text x="190" y="448" fill="#b5652b" font-size="14" font-weight="600" text-anchor="middle">Admin? Use the admin login →</text></a>
  </g>
</svg>
